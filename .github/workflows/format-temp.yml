name: Temporary Rust formatting check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format-dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources and print parser
        run: |
          cargo fmt --all
          echo "NEOLINT_PARSER_DUMP_BEGIN"
          cat src/parser.rs
          echo "NEOLINT_PARSER_DUMP_END"
