name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js for the website build
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            editors/vscode/package-lock.json

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Build the Astro / Starlight website
        working-directory: site
        run: npm run build

      - name: Test canonical metadata extractor
        run: python3 -m unittest discover --start-directory scripts --pattern 'test_*.py'

      - name: Check documentation contracts
        run: python3 scripts/test_documentation.py

      - name: Install VS Code extension dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Audit, check and compile the VS Code extension
        working-directory: editors/vscode
        run: |
          npm audit
          npm run check
          npm run compile

      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: npm run package

      - name: Verify the VSIX runtime contents
        working-directory: editors/vscode
        run: python3 ../../scripts/verify_vsix.py neolint-vscode-0.2.0.vsix

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run debug tests
        run: cargo test --all-targets --all-features

      - name: Build and smoke-test the LSP executable
        shell: bash
        run: |
          set -euo pipefail
          cargo build --features lsp --bin neolint-lsp
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          python3 scripts/release-smoke-lsp.py --binary target/debug/neolint-lsp --version "$version"

      - name: Run release tests
        run: cargo test --release --all-targets --all-features

      - name: Generate third-party notices
        run: |
          cargo fetch --locked
          python3 scripts/generate-third-party-notices.py --output /tmp/neolint-third-party-notices.md

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0

      - name: Run tests on MSRV 1.75.0
        run: cargo +1.75.0 test --all-targets --all-features

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git diff --check "refs/remotes/origin/${BASE_REF}...HEAD"
