name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js for the website build
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            editors/vscode/package-lock.json

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Build the Astro / Starlight website
        working-directory: site
        run: npm run build

      - name: Test canonical metadata extractor
        run: python3 -m unittest discover --start-directory scripts --pattern 'test_*.py'

      - name: Check documentation contracts
        run: python3 scripts/test_documentation.py

      - name: Install VS Code extension dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Check and compile the VS Code extension
        working-directory: editors/vscode
        run: npm run check && npm run compile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run debug tests
        run: cargo test --all-targets --all-features

      - name: Run release tests
        run: cargo test --release --all-targets --all-features

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0

      - name: Run tests on MSRV 1.75.0
        run: cargo +1.75.0 test --all-targets --all-features

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git diff --check "refs/remotes/origin/${BASE_REF}...HEAD"
