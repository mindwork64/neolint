name: Release artifacts

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "data/**"
      - "editors/vscode/**"
      - "scripts/release-*"
      - "scripts/generate-third-party-notices.py"
      - "scripts/verify_*.py"
      - "LICENSE-MIT"
      - "LICENSE-APACHE"
      - "LICENSES/**"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish artifacts to a GitHub Release (requires a v* tag with matching Cargo version)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Read package version (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Read package version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          "PACKAGE_VERSION=$($metadata.packages[0].version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build optimized CLI
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}" --bin neolint

      - name: Build optimized language server
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}" --features lsp --bin neolint-lsp

      - name: Smoke test CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/release-smoke.sh "target/${{ matrix.target }}/release/neolint" "$PACKAGE_VERSION"

      - name: Smoke test CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release-smoke.ps1 -Binary "target/${{ matrix.target }}/release/neolint.exe" -Version $env:PACKAGE_VERSION

      - name: Smoke test LSP protocol (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/release-smoke-lsp.py --binary "target/${{ matrix.target }}/release/neolint-lsp" --version "$PACKAGE_VERSION"

      - name: Smoke test LSP protocol (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/release-smoke-lsp.py --binary "target/${{ matrix.target }}/release/neolint-lsp.exe" --version $env:PACKAGE_VERSION

      - name: Package archive and checksum (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          archive="neolint-v${PACKAGE_VERSION}-${target}.tar.gz"
          package_dir=".release-package"
          mkdir -p dist
          rm -rf "$package_dir"
          mkdir -p "$package_dir/LICENSES"
          cargo fetch --locked
          python3 scripts/generate-third-party-notices.py --output "$package_dir/THIRD-PARTY-NOTICES.md"
          install -m 755 "target/${target}/release/neolint" "$package_dir/neolint"
          install -m 755 "target/${target}/release/neolint-lsp" "$package_dir/neolint-lsp"
          install -m 644 LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "$package_dir/"
          install -m 644 data/README.md "$package_dir/DATA-NOTICES.md"
          install -m 644 LICENSES/LINDEN-RESEARCH-MIT.txt LICENSES/OPENSIM-NOTICE.txt "$package_dir/LICENSES/"
          tar -czf "dist/$archive" -C "$package_dir" .
          rm -rf "$package_dir"
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Package archive and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "${{ matrix.target }}"
          $archive = "neolint-v$env:PACKAGE_VERSION-$target.zip"
          $packageDir = ".release-package"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Remove-Item -Recurse -Force $packageDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$packageDir/LICENSES" | Out-Null
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "Cargo dependency fetch failed" }
          python scripts/generate-third-party-notices.py --output "$packageDir/THIRD-PARTY-NOTICES.md"
          if ($LASTEXITCODE -ne 0) { throw "third-party notice generation failed" }
          Copy-Item "target/$target/release/neolint.exe" "$packageDir/neolint.exe"
          Copy-Item "target/$target/release/neolint-lsp.exe" "$packageDir/neolint-lsp.exe"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md, CHANGELOG.md "$packageDir/"
          Copy-Item data/README.md "$packageDir/DATA-NOTICES.md"
          Copy-Item LICENSES/LINDEN-RESEARCH-MIT.txt, LICENSES/OPENSIM-NOTICE.txt "$packageDir/LICENSES/"
          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/$archive" -Force
          Remove-Item -Recurse -Force $packageDir
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "dist/$archive.sha256",
            "$hash  $archive`n",
            [System.Text.Encoding]::ASCII
          )

      - name: Upload platform archive
        uses: actions/upload-artifact@v7
        with:
          name: neolint-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  package-vscode:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install locked extension dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Audit extension packaging dependencies
        working-directory: editors/vscode
        run: npm audit

      - name: Check, compile and package extension
        working-directory: editors/vscode
        run: |
          npm run check
          npm run package
          python3 ../../scripts/verify_vsix.py neolint-vscode-0.2.0.vsix

      - name: Generate VSIX checksum
        working-directory: editors/vscode
        run: sha256sum neolint-vscode-0.2.0.vsix > neolint-vscode-0.2.0.vsix.sha256

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: neolint-vscode
          path: |
            editors/vscode/neolint-vscode-0.2.0.vsix
            editors/vscode/neolint-vscode-0.2.0.vsix.sha256
          if-no-files-found: error

  validate-artifacts:
    name: Validate release assets
    needs: [build, package-vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Validate tag against package version when tagged
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "release: tag ${GITHUB_REF_NAME} does not match Cargo package version v${version}" >&2
            exit 1
          fi

      - name: Verify archives, checksums, licenses and VSIX contents
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          linux_archive="dist/neolint-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          windows_archive="dist/neolint-v${version}-x86_64-pc-windows-msvc.zip"
          vsix="dist/neolint-vscode-0.2.0.vsix"

          for file in "$linux_archive" "$windows_archive" "$vsix"; do
            test -s "$file"
            test -s "${file}.sha256"
            (cd dist && sha256sum -c "$(basename "$file").sha256")
          done

          python3 scripts/verify_vsix.py "$vsix"
          python3 scripts/verify_release_archives.py --linux "$linux_archive" --windows "$windows_archive"
          echo "release asset validation: ok"

  publish:
    name: Attach artifacts to GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && startsWith(github.ref, 'refs/tags/v')
    needs: [build, package-vscode, validate-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Validate publication target and version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "release: publication requires a v* tag ref, got ${GITHUB_REF}" >&2
            exit 1
          fi
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "release: tag ${GITHUB_REF_NAME} does not match Cargo package version v${version}" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release: ${GITHUB_REF_NAME} already exists; refusing to overwrite assets" >&2
            exit 1
          fi

      - name: Build release notes from CHANGELOG
        shell: bash
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys
          from pathlib import Path

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = f"## [{version}]"
          try:
              start = next(index for index, line in enumerate(lines) if line.startswith(heading))
          except StopIteration:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          end = next(
              (index for index in range(start + 1, len(lines)) if lines[index].startswith("## [")),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip() + "\n"
          Path("dist/release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/neolint-* \
            --verify-tag \
            --title "NeoLint ${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md
